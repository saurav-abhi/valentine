<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        text-align: center;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        z-index: 2;
        animation: fadeIn 1s ease;
    }

    h1 {
        color: #ff3366;
    }

    p {
        color: #444;
        font-size: 16px;
    }

    .question {
        font-size: 20px;
        font-weight: bold;
        color: #ff3366;
        margin: 25px 0;
    }

    button {
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yesBtn {
        background: #ff3366;
        color: white;
    }

    #yesBtn:hover {
        transform: scale(1.05);
    }

    #noBtn {
        background: #ddd;
        color: #555;
        position: absolute;
    }

    .hidden {
        display: none;
    }

    .result img {
        width: 230px;
        border-radius: 15px;
        margin-top: 15px;
    }

    /* Floating hearts */
    .heart {
        position: fixed;
        bottom: -20px;
        font-size: 20px;
        animation: floatUp 6s linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
    <source src="https://pixabay.com/music/modern-classical-hopeful-love-romantic-music-340835.mp3" type="audio/mpeg">
</audio>

<!-- MAIN CARD -->
<div class="card" id="mainCard">
    <h1>Hey You ❤️</h1>
    <p>
        You’ve unknowingly become one of the most important parts of my life.
        Every conversation with you makes my day better.
    </p>

    <div class="question">
        Will you be my girlfriend and my Valentine? 💖
    </div>

    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 🙄</button>
</div>

<!-- RESULT CARD -->
<div class="card hidden result" id="resultCard">
    <h1>She Said YESSS 🥰💖</h1>
    <p>
        I promise to make you smile, protect your heart,
        and love you more every day.
    </p>
    <img src="https://i.imgur.com/9QZ7ZbF.png" alt="Love">
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const mainCard = document.getElementById("mainCard");
    const resultCard = document.getElementById("resultCard");
    const music = document.getElementById("bgMusic");

    // NO button runs away
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    function moveNo() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // YES button
    yesBtn.addEventListener("click", () => {
        music.play(); // mobile-safe
        mainCard.classList.add("hidden");
        resultCard.classList.remove("hidden");
    });

    // Floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 10 + 15 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
</script>

</body>
</html>
